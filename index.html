<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acrostic Master - Puzzle Selection</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="home-container">
        <header class="home-header">
            <h1>ACROSTIC</h1>
        </header>

        <section class="featured-section">
            <h2 class="section-title">LATEST PUZZLE</h2>
            <div id="featured-puzzle">
                <!-- Latest puzzle will load here -->
            </div>
        </section>

        <section class="all-puzzles-section">
            <button id="toggle-all-puzzles" class="dropdown-trigger">
                <span>ALL PUZZLES</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="all-puzzles-content" class="dropdown-content">
                <main id="puzzle-list" class="puzzle-grid">
                    <!-- Puzzles will be loaded here -->
                </main>
            </div>
        </section>
    </div>

    <script src="js/home.js"></script>
</body>
</html>
